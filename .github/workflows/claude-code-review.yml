name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, and drafts are reviewed once marked ready.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the current working directory.

            1. Read `.claude/agents/code-reviewer.md` and follow it as your review instructions (scope, context to read, checklist, severities).
            2. Get the change with `gh pr diff ${{ github.event.pull_request.number }}` and the description with `gh pr view ${{ github.event.pull_request.number }}`.
            3. Read existing comments with `gh pr view ${{ github.event.pull_request.number }} --comments`. Don't repeat a finding that is already posted and still applies.
            4. Post each finding as an inline comment on the changed line with `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`), using the finding format from the instructions.
            5. Post one top-level comment with `gh pr comment` containing the summary, a count of findings by severity, and the verdict.

            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --permission-mode default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
