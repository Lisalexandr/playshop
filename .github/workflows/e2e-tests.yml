name: E2E tests

# Reusable workflow: builds the app, runs the Playwright E2E tests on the checked-out commit,
# and uploads the HTML report as the playwright-report artifact.
on:
  workflow_call:
    outputs:
      tests-ran:
        description: "'true' when the test step ran, whether the tests passed or failed"
        value: ${{ jobs.build-and-test.outputs.tests-ran }}
      sha:
        description: Commit the tests ran on
        value: ${{ jobs.build-and-test.outputs.sha }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tests-ran: ${{ steps.tests.outcome == 'success' || steps.tests.outcome == 'failure' }}
      sha: ${{ steps.checkout.outputs.commit }}
    env:
      # .env is git-ignored. These are the public seeded demo accounts documented in README.md.
      # TODO: Move test accounts to a separate .env.test file and load it in the test setup.
      BASE_URL: http://localhost:5173
      TEST_USER_1: alice@example.com
      TEST_PASSWORD_1: Password123!
      TEST_USER_2: bob@example.com
      TEST_PASSWORD_2: Password123!
      TEST_USER_3: locked@example.com
      TEST_PASSWORD_3: Password123!
      TEST_USER_4: slow@example.com
      TEST_PASSWORD_4: Password123!
      TEST_USER_ADMIN: admin@example.com
      TEST_PASSWORD_ADMIN: Admin123!
    steps:
      - uses: actions/checkout@v7
        id: checkout

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        run: npm test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
