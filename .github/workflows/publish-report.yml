name: Publish Playwright report

# Reusable workflow: publishes the playwright-report artifact of the calling run to GitHub Pages
# and links it from the run summary (and from the PR on pull_request runs).
on:
  workflow_call:
    inputs:
      result:
        description: Result of the test job (success or failure)
        required: true
        type: string
      sha:
        description: Commit the tests ran on
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: publish-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report

      - name: Publish report to GitHub Pages
        id: publish
        run: |
          set -euo pipefail
          dir="reports/$(date -u +%F)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add --detach site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages site
          fi
          cd site
          cutoff=$(date -u -d '14 days ago' +%F)
          for old in reports/*/; do
            if [ -d "$old" ] && [[ "$(basename "$old" | cut -c1-10)" < "$cutoff" ]]; then rm -rf "$old"; fi
          done
          mkdir -p "$dir"
          cp -R ../playwright-report/. "$dir/"
          touch .nojekyll
          git add -A
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          # A single parentless commit keeps old report files out of the branch history.
          commit=$(git commit-tree "$(git write-tree)" -m "Playwright report for run ${GITHUB_RUN_ID}")
          git push --force origin "$commit:refs/heads/gh-pages"
          echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/$dir/" >> "$GITHUB_OUTPUT"

      - name: Link the report from the run summary
        id: link
        env:
          URL: ${{ steps.publish.outputs.url }}
          RESULT: ${{ inputs.result }}
          SHA: ${{ inputs.sha }}
        run: |
          body="<!-- playwright-report -->
          **Playwright report** for ${SHA:0:7} (tests: ${RESULT}): ${URL}

          GitHub Pages can take a minute to publish a new report."
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          { echo 'body<<EOF'; echo "$body"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Link the report from the PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.link.outputs.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- playwright-report -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" > /dev/null
          fi
