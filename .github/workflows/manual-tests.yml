name: Run E2E tests manually

run-name: E2E tests on ${{ github.ref_name }}

# Pick the branch in "Use workflow from" (master by default). The branch must contain this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tests-ran: ${{ steps.tests.outcome == 'success' || steps.tests.outcome == 'failure' }}
      sha: ${{ steps.checkout.outputs.commit }}
    env:
      # .env is git-ignored. These are the public seeded demo accounts documented in README.md.
      BASE_URL: http://localhost:5173
      TEST_USER_1: alice@example.com
      TEST_PASSWORD_1: Password123!
      TEST_USER_2: bob@example.com
      TEST_PASSWORD_2: Password123!
      TEST_USER_3: locked@example.com
      TEST_PASSWORD_3: Password123!
      TEST_USER_4: slow@example.com
      TEST_PASSWORD_4: Password123!
      TEST_USER_ADMIN: admin@example.com
      TEST_PASSWORD_ADMIN: Admin123!
    steps:
      - uses: actions/checkout@v7
        id: checkout

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        run: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  publish-report:
    needs: test
    # Publish whenever the tests ran, pass or fail.
    if: ${{ !cancelled() && needs.test.outputs.tests-ran == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-report.yml
    with:
      result: ${{ needs.test.result }}
      sha: ${{ needs.test.outputs.sha }}
