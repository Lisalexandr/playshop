name: Run E2E tests manually

run-name: E2E tests on ${{ github.ref_name }}

# Pick the branch in "Use workflow from" (master by default). The branch must contain this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/e2e-tests.yml

  publish-report:
    needs: e2e
    # Publish whenever the tests ran, pass or fail.
    if: ${{ !cancelled() && needs.e2e.outputs.tests-ran == 'true' }}
    permissions:
      contents: write # push the report to the gh-pages branch
    uses: ./.github/workflows/publish-report.yml
    with:
      result: ${{ needs.e2e.result }}
      sha: ${{ needs.e2e.outputs.sha }}
