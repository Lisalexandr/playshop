name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # .env is git-ignored. These are the public seeded demo accounts documented in README.md.
      # TODO: Move test accounts to a separate .env.test file and load it in the test setup.
      BASE_URL: http://localhost:5173
      TEST_USER_1: alice@example.com
      TEST_PASSWORD_1: Password123!
      TEST_USER_2: bob@example.com
      TEST_PASSWORD_2: Password123!
      TEST_USER_3: locked@example.com
      TEST_PASSWORD_3: Password123!
      TEST_USER_4: slow@example.com
      TEST_PASSWORD_4: Password123!
      TEST_USER_ADMIN: admin@example.com
      TEST_PASSWORD_ADMIN: Admin123!
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  publish-report:
    needs: build-and-test
    # Fork PRs get a read-only token and can't push to gh-pages.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: publish-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report

      - name: Publish report to GitHub Pages
        id: publish
        run: |
          set -euo pipefail
          dir="reports/$(date -u +%F)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add --detach site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages site
          fi
          cd site
          cutoff=$(date -u -d '14 days ago' +%F)
          for old in reports/*/; do
            if [ -d "$old" ] && [[ "$(basename "$old" | cut -c1-10)" < "$cutoff" ]]; then rm -rf "$old"; fi
          done
          mkdir -p "$dir"
          cp -R ../playwright-report/. "$dir/"
          touch .nojekyll
          git add -A
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          # A single parentless commit keeps old report files out of the branch history.
          commit=$(git commit-tree "$(git write-tree)" -m "Playwright report for run ${GITHUB_RUN_ID}")
          git push --force origin "$commit:refs/heads/gh-pages"
          echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/$dir/" >> "$GITHUB_OUTPUT"

      - name: Link the report from the run summary and the PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.publish.outputs.url }}
          RESULT: ${{ needs.build-and-test.result }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- playwright-report -->'
          body="$marker
          **Playwright report** for ${SHA:0:7} (tests: ${RESULT}): ${URL}

          GitHub Pages can take a minute to publish a new report."
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
