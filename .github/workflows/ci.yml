name: Run E2E tests on pull requests

on:
  pull_request:

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/e2e-tests.yml

  publish-report:
    needs: e2e
    # Publish whenever the tests ran, pass or fail. Fork PRs get a read-only token and can't push to gh-pages.
    if: ${{ !cancelled() && needs.e2e.outputs.tests-ran == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write # push the report to the gh-pages branch
      pull-requests: write # post the report link on the PR
    uses: ./.github/workflows/publish-report.yml
    with:
      result: ${{ needs.e2e.result }}
      # The PR's head commit, which is what reviewers know, rather than the merge commit the tests ran on.
      sha: ${{ github.event.pull_request.head.sha }}
